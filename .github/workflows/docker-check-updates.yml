name: docker-check-updates

on:
  push:
    paths:
      - "Linux/docker-check-updates/**"
      - ".github/workflows/docker-check-updates.yml"
  pull_request:
    paths:
      - "Linux/docker-check-updates/**"
      - ".github/workflows/docker-check-updates.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate stable Bash syntax
        run: bash -n Linux/docker-check-updates/docker-check-updates.sh

      - name: Validate embedded Python in stable Bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Linux/docker-check-updates/docker-check-updates.sh").read_text()
          start_marker = "<<'PY_PORTAINER_HELPER'\n"
          end_marker = "\nPY_PORTAINER_HELPER\n"

          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          helper = source[start:end]

          Path("/tmp/portainer-agent-manager.py").write_text(helper)
          PY
          python3 -m py_compile /tmp/portainer-agent-manager.py

      - name: Validate Python v4 syntax
        run: python3 -m py_compile Linux/docker-check-updates/docker-check-updates.py

      - name: Validate Python v4 CLI
        run: |
          python3 Linux/docker-check-updates/docker-check-updates.py --version
          python3 Linux/docker-check-updates/docker-check-updates.py --help >/dev/null
