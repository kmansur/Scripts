name: docker-check-updates

on:
  push:
    paths:
      - "Linux/docker-check-updates/**"
      - ".github/workflows/docker-check-updates.yml"
  pull_request:
    paths:
      - "Linux/docker-check-updates/**"
      - ".github/workflows/docker-check-updates.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax and CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate stable Bash syntax
        run: bash -n Linux/docker-check-updates/docker-check-updates.sh

      - name: Validate embedded Python in stable Bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Linux/docker-check-updates/docker-check-updates.sh").read_text()
          start_marker = "<<'PY_PORTAINER_HELPER'\n"
          end_marker = "\nPY_PORTAINER_HELPER\n"

          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          helper = source[start:end]

          Path("/tmp/portainer-agent-manager.py").write_text(helper)
          PY
          python3 -m py_compile /tmp/portainer-agent-manager.py

      - name: Validate Python v4 syntax
        run: python3 -m py_compile Linux/docker-check-updates/docker-check-updates.py

      - name: Validate Python v4 CLI
        run: |
          python3 Linux/docker-check-updates/docker-check-updates.py --version
          python3 Linux/docker-check-updates/docker-check-updates.py --help >/dev/null

      - name: Smoke-test Python v4 core logic
        run: |
          python3 - <<'PY'
          import importlib.util
          import sys
          import tempfile
          from pathlib import Path

          script = Path("Linux/docker-check-updates/docker-check-updates.py")
          spec = importlib.util.spec_from_file_location("dcu", script)
          dcu = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = dcu
          spec.loader.exec_module(dcu)

          cfg = dcu.Config()
          runner = dcu.Runner()
          docker = dcu.DockerClient(runner)
          summary = dcu.Summary()
          backups = dcu.BackupManager(cfg, docker, runner)
          portainer = dcu.PortainerManager(cfg, docker, runner, backups, summary)

          # NetBox tag parser.
          assert dcu.VersionInspector.parse_netbox_tag("v4.6.10-5.0.2") == ("4.6.10", "5.0.2")
          assert dcu.VersionInspector.parse_netbox_tag("v4.6-5.0.2") == ("4.6", "5.0.2")

          base_labels = {
              "com.docker.compose.project": "portainer-agent",
              "com.docker.compose.service": "agent",
              "com.docker.compose.project.working_dir": "/opt/portainer-agent",
              "com.docker.compose.project.config_files": "/opt/portainer-agent/docker-compose.yml",
          }

          # Moving tag (real production case: sts).
          moving_inspect = {
              "Image": "sha256:0123456789abcdef",
              "Config": {
                  "Image": "portainer/agent:sts",
                  "Labels": base_labels,
              },
          }
          moving = portainer.compose_agent_metadata(moving_inspect, "2.45.0")
          assert moving["mode"] == "channel"
          helper = portainer.build_compose_helper(
              moving,
              moving_inspect["Image"],
              "2.45.0",
              "2.45.1",
          )
          assert "--pull never" in helper
          assert 'TARGET_REF=portainer/agent:sts' in helper
          Path("/tmp/dcu-helper-moving.sh").write_text(helper)

          # Fixed Agent tag.
          fixed_inspect = {
              "Image": "sha256:fedcba9876543210",
              "Config": {
                  "Image": "portainer/agent:2.45.0",
                  "Labels": base_labels,
              },
          }
          fixed = portainer.compose_agent_metadata(fixed_inspect, "2.45.0")
          assert fixed["mode"] == "fixed"
          helper = portainer.build_compose_helper(
              fixed,
              fixed_inspect["Image"],
              "2.45.0",
              "2.45.1",
          )
          assert "portainer/agent:2.45.1" in helper
          Path("/tmp/dcu-helper-fixed.sh").write_text(helper)

          # Portainer body-less POST must be truly empty for Docker start.
          class FakeResponse:
              def __enter__(self):
                  return self
              def __exit__(self, exc_type, exc, tb):
                  return False
              def read(self):
                  return b""

          original_urlopen = dcu.urllib.request.urlopen
          def fake_urlopen(request, **kwargs):
              assert request.method == "POST"
              assert request.data == b""
              assert request.get_header("Content-length") == "0"
              return FakeResponse()

          dcu.urllib.request.urlopen = fake_urlopen
          try:
              client = dcu.PortainerClient("https://127.0.0.1:9443", "token", insecure=True)
              assert client.post("/endpoints/1/docker/containers/abc/start", raw=True) == b""
          finally:
              dcu.urllib.request.urlopen = original_urlopen

          # Legacy v3 manifest compatibility.
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / "manifest.tsv").write_text(
                  "container_name\tcontainer_id\timage_ref\timage_id\tproject\tservice\tworkdir\n"
                  "agent\tabc\tportainer/agent:sts\tsha256:old\tpa\tagent\t/opt/pa\n"
              )
              app = dcu.Application(cfg)
              manifest = app.load_backup_manifest(root)
              assert manifest[0]["image_ref"] == "portainer/agent:sts"
              assert manifest[0]["compose"]["project"] == "pa"
          PY

          sh -n /tmp/dcu-helper-moving.sh
          sh -n /tmp/dcu-helper-fixed.sh
